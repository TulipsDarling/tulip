<style>
  :root{
    --cream:#f6efe4;
    --cream-2:#efe4d1;
    --paper:#fffdf9;
    --espresso:#3a2820;
    --espresso-soft:#6b4f3f;
    --clay:#b5652d;
    --clay-deep:#93481f;
    --gold:#c99a4a;
    --line:#e2d3b8;
    --shadow: 0 10px 30px -12px rgba(58,40,32,0.25);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    background-image:
      radial-gradient(ellipse at top left, rgba(201,154,74,0.12), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(181,101,45,0.10), transparent 55%);
    color:var(--espresso);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .ar{ font-family:'Cairo',sans-serif; direction:rtl; unicode-bidi:isolate; }

  header.top{ padding:48px 20px 28px; text-align:center; position:relative; }
  .logo-mark{
    width:64px;height:64px; margin:0 auto 18px; border-radius:50%;
    background:linear-gradient(155deg,var(--clay),var(--clay-deep));
    display:flex;align-items:center;justify-content:center; box-shadow:var(--shadow);
  }
  .logo-mark svg{ width:32px;height:32px; fill:none; stroke:var(--cream); stroke-width:1.6; }
  .brand-row{ display:flex; flex-direction:column; gap:2px; align-items:center; }
  .brand-en{ font-family:'Fraunces',serif; font-weight:600; font-size:1.5rem; letter-spacing:0.02em; color:var(--espresso); }
  .brand-ar{ font-family:'Cairo',sans-serif; font-size:1.05rem; color:var(--espresso-soft); direction:rtl; }
  .eyebrow{
    margin-top:26px; display:inline-flex; align-items:center; gap:10px;
    font-size:0.72rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--clay-deep); font-weight:600;
  }
  .eyebrow::before,.eyebrow::after{ content:""; width:24px; height:1px; background:var(--gold); display:inline-block; }
  h1.hero{
    font-family:'Fraunces',serif; font-style:italic; font-weight:500;
    font-size:clamp(2.2rem,6vw,3.4rem); margin:14px 0 6px; color:var(--espresso);
  }
  .hero-ar{ font-family:'Cairo',sans-serif; direction:rtl; color:var(--espresso-soft); font-size:1.05rem; letter-spacing:0.02em; }
  .hero-ar::before{ content:"قائمتنا · "; }

  .search-wrap{ max-width:480px; margin:32px auto 0; padding:0 20px; }
  .search-box{ position:relative; display:flex; align-items:center; }
  .search-box svg{ position:absolute;left:18px; width:17px;height:17px;stroke:var(--espresso-soft);fill:none;stroke-width:2; pointer-events:none; }
  .search-box input{
    width:100%; padding:13px 18px 13px 44px; border-radius:999px; border:1px solid var(--line);
    background:var(--paper); font-family:'Inter',sans-serif; font-size:0.95rem; color:var(--espresso);
    outline:none; box-shadow:var(--shadow); transition:border-color .2s ease;
  }
  .search-box input:focus{ border-color:var(--clay); }
  .search-box input::placeholder{ color:#b9a892; }

  main{ max-width:820px; margin:0 auto; padding:36px 20px 60px; }

  details.category{
    background:var(--paper); border:1px solid var(--line); border-radius:16px;
    margin-bottom:14px; box-shadow:var(--shadow); overflow:hidden;
  }
  details.category[open]{ border-color:var(--clay); }

  summary.cat-summary{
    list-style:none; cursor:pointer; padding:18px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    -webkit-tap-highlight-color:transparent;
  }
  summary.cat-summary::-webkit-details-marker{ display:none; }

  .cat-summary-left{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .cat-en{ font-family:'Fraunces',serif; font-weight:600; font-size:1.25rem; color:var(--espresso); }
  .cat-ar{ font-family:'Cairo',sans-serif; direction:rtl; color:var(--clay-deep); font-size:1rem; }
  .cat-summary-right{ display:flex; align-items:center; gap:12px; flex:none; }
  .cat-count{
    font-size:0.72rem; color:var(--espresso-soft); background:var(--cream-2);
    padding:4px 10px; border-radius:999px; white-space:nowrap; font-weight:600;
  }
  .chevron{ width:20px;height:20px; stroke:var(--espresso-soft); fill:none; stroke-width:2.2; transition:transform .25s ease; flex:none; }
  details.category[open] .chevron{ transform:rotate(180deg); stroke:var(--clay-deep); }

  .cat-panel{ padding:4px 20px 22px; border-top:1px solid var(--line); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:16px; padding-top:18px; }
  .card{
    background:var(--cream); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; display:flex;flex-direction:column; transition:transform .15s ease;
  }
  .card:hover{ transform:translateY(-2px); }
  .card-img{
    width:100%; aspect-ratio:4/3; background:linear-gradient(140deg,var(--cream-2),var(--cream));
    display:flex;align-items:center;justify-content:center; overflow:hidden; position:relative;
  }
  .card-img img{ width:100%;height:100%;object-fit:cover; display:block; }
  .card-img .placeholder{ font-family:'Fraunces',serif; font-size:1.9rem; font-weight:600; color:var(--clay); opacity:0.55; }
  .card-body{ padding:12px 14px 14px; flex:1; display:flex; flex-direction:column; }
  .card-title-row{ display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; margin-bottom:9px; }
  .card-title-en{ font-family:'Fraunces',serif; font-weight:600; font-size:1rem; color:var(--espresso); }
  .dot{ color:var(--gold); font-size:0.9rem; }
  .card-title-ar{ font-family:'Cairo',sans-serif; direction:rtl; font-size:0.88rem; color:var(--espresso-soft); }
  .price-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; }
  .price-list li{
    display:flex;justify-content:space-between;align-items:center; font-size:0.84rem;
    color:var(--espresso-soft); border-top:1px dashed var(--line); padding-top:5px;
  }
  .price-list li:first-child{ border-top:none; padding-top:0; }
  .price-list .price{ font-weight:700; color:var(--clay-deep); font-family:'Inter',sans-serif; }
  .single-price{ font-weight:700; color:var(--clay-deep); font-size:1rem; }
  .sold-out{
    font-size:0.7rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
    color:#a33; background:#f6dede; padding:2px 8px; border-radius:999px; align-self:flex-start; margin-bottom:6px;
  }

  .no-results{
    text-align:center; padding:60px 20px; color:var(--espresso-soft);
    font-family:'Fraunces',serif; font-style:italic; font-size:1.2rem; display:none;
  }

  .expand-controls{ display:flex; justify-content:center; gap:10px; margin-bottom:20px; }
  .expand-controls button{
    font-family:'Inter',sans-serif; font-size:0.78rem; font-weight:600; padding:8px 16px;
    border-radius:999px; border:1px solid var(--line); background:var(--paper); color:var(--espresso-soft); cursor:pointer;
  }
  .expand-controls button:hover{ background:var(--espresso); color:var(--cream); border-color:var(--espresso); }

  footer{ text-align:center; padding:40px 20px 60px; border-top:1px solid var(--line); }
  .footer-note{ font-size:0.8rem; color:var(--espresso-soft); margin-bottom:18px; }
  .footer-note .ar{ font-size:0.8rem; }
  .footer-brand{ font-family:'Fraunces',serif; font-weight:600; font-size:1.15rem; color:var(--espresso); }
  .footer-loc{ font-size:0.82rem; color:var(--espresso-soft); margin-top:4px; }

  @media (max-width:480px){
    .grid{ grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; }
    h1.hero{ font-size:2rem; }
    .cat-en{ font-size:1.1rem; }
  }
</style>

// ---- Build structured menu: group by category -> item name -> sizes[] ----
const categories = [];
const catIndex = {};
const itemIndex = {};

for(const row of FALLBACK_ROWS){
  const [catEn, catAr, itemEn, itemAr, size, price, availability, link] = row;
  if(!(catEn in catIndex)){
    catIndex[catEn] = { en: catEn.trim(), ar: catAr.trim(), items: [] };
    categories.push(catIndex[catEn]);
  }
  const cat = catIndex[catEn];
  const key = catEn + '|' + itemEn;
  if(!(key in itemIndex)){
    const item = { en: itemEn.trim(), ar: itemAr.trim(), image: "", sizes: [], available: true };
    itemIndex[key] = item;
    cat.items.push(item);
  }
  const item = itemIndex[key];
  if (link && link.trim() && !item.image) {
  item.image = link.trim();
  }
  const isAvailable = !(availability && availability.trim().toLowerCase() === 'no');
  if(!isAvailable) item.available = false;
  item.sizes.push({ size: size || '', price: price });
}

// ---- Render ----
const root = document.getElementById('menuRoot');
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');

categories.forEach(cat=>{
  const id = 'cat-' + slug(cat.en);

  const details = document.createElement('details');
  details.className = 'category';
  details.id = id;

  const summary = document.createElement('summary');
  summary.className = 'cat-summary';
  summary.innerHTML = `
    <span class="cat-summary-left">
      <span class="cat-en">${cat.en}</span>
      <span class="cat-ar ar">${cat.ar}</span>
    </span>
    <span class="cat-summary-right">
      <span class="cat-count">${cat.items.length} items</span>
      <svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </span>
  `;
  details.appendChild(summary);

  const panel = document.createElement('div');
  panel.className = 'cat-panel';
  const grid = document.createElement('div');
  grid.className = 'grid';

  cat.items.forEach(item=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.search = (item.en + ' ' + item.ar + ' ' + cat.en + ' ' + cat.ar).toLowerCase();

    const imgWrap = document.createElement('div');
    imgWrap.className = 'card-img';
    if (item.image) {
      const img = document.createElement("img");
      img.src = item.image;
      img.alt = item.en;
      img.loading = "lazy";
      img.decoding = "async";

      img.onerror = () => {
        imgWrap.innerHTML = `<span class="placeholder">${item.en.charAt(0)}</span>`;
      };

      imgWrap.appendChild(img);
    } else {
      imgWrap.innerHTML = `<span class="placeholder">${item.en.charAt(0)}</span>`;
    }

    const body = document.createElement('div');
    body.className = 'card-body';

    let priceHtml = '';
    const realSizes = item.sizes.filter(s=>s.size);
    if(realSizes.length){
      priceHtml = `<ul class="price-list">` + item.sizes.map(s=>
        `<li><span class="size">${s.size}</span><span class="price">${s.price} QAR</span></li>`
      ).join('') + `</ul>`;
    } else {
      priceHtml = `<div class="single-price">${item.sizes[0].price} QAR</div>`;
    }

    body.innerHTML = `
      ${!item.available ? '<span class="sold-out">Sold out</span>' : ''}
      <div class="card-title-row">
        <span class="card-title-en">${item.en}</span>
        <span class="dot">•</span>
        <span class="card-title-ar ar">${item.ar}</span>
      </div>
      ${priceHtml}
    `;
    if(!item.available){ card.style.opacity = '0.55'; }

    card.appendChild(imgWrap);
    card.appendChild(body);
    grid.appendChild(card);
  });

  panel.appendChild(grid);
  details.appendChild(panel);
  root.appendChild(details);
});

// ---- Expand / collapse all ----
document.getElementById('expandAll').addEventListener('click', ()=>{
  document.querySelectorAll('details.category').forEach(d=>d.open = true);
});
document.getElementById('collapseAll').addEventListener('click', ()=>{
  document.querySelectorAll('details.category').forEach(d=>d.open = false);
});

// ---- Search filter (auto-opens categories with matches) ----
const searchInput = document.getElementById('searchInput');
const noResults = document.getElementById('noResults');
searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim().toLowerCase();
  let visibleCount = 0;
  document.querySelectorAll('details.category').forEach(details=>{
    let sectionHasVisible = false;
    details.querySelectorAll('.card').forEach(card=>{
      const match = !q || card.dataset.search.includes(q);
      card.style.display = match ? '' : 'none';
      if(match) sectionHasVisible = true;
    });
    details.style.display = sectionHasVisible ? '' : 'none';
    if(q){ details.open = sectionHasVisible; } else { details.open = false; }
    if(sectionHasVisible) visibleCount++;
  });
  noResults.style.display = (q && visibleCount === 0) ? 'block' : 'none';
});
</script>
</body>
